name: Build and release exe

# Pushing a tag like v1.0.1 builds QuickFileSearch.exe and attaches it to a GitHub Release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build exe
        shell: powershell
        run: |
          $v = "${{ github.ref_name }}".TrimStart('v')
          if ($v -notmatch '^\d+(\.\d+){1,3}$') { $v = '0.0.0' }
          while (($v -split '\.').Count -lt 4) { $v = "$v.0" }
          .\build.ps1 -Version $v

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuickFileSearch
          path: dist/QuickFileSearch.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/QuickFileSearch.exe
          generate_release_notes: true
